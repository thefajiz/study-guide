<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Arcade — Sunflower Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sun: #FFD700;
  --sun-dark: #FFA500;
  --leaf: #228B22;
  --leaf-light: #32CD32;
  --arcade-bg: #0d0d1a;
  --screen-bg: #001100;
  --pixel-green: #00ff41;
  --pixel-yellow: #ffff00;
  --pixel-red: #ff4444;
  --pixel-white: #ffffff;
  --glow-gold: 0 0 10px #FFD700, 0 0 20px #FFA500;
  --glow-green: 0 0 10px #00ff41;
  --glow-red: 0 0 10px #ff4444;
}

body {
  background: #1a3a0a;
  font-family: 'Press Start 2P', monospace;
  color: var(--pixel-green);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== SUNFLOWER FIELD BG ===== */
#sunflower-field {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0;
  overflow: hidden;
  background: linear-gradient(180deg, #87CEEB 0%, #98D8E8 30%, #5a9e2f 30%, #3d7a1a 60%, #2d5e12 100%);
  pointer-events: none;
}

/* Sky clouds */
.cloud {
  position: absolute;
  background: rgba(255,255,255,0.7);
  border-radius: 50px;
  animation: cloudDrift linear infinite;
}
.cloud::before, .cloud::after {
  content:'';
  position:absolute;
  background: rgba(255,255,255,0.7);
  border-radius: 50%;
}

/* Grass */
.grass-layer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 45%;
  background: linear-gradient(180deg, #4a8e20 0%, #2d6010 100%);
}

/* Sun in sky */
.sky-sun {
  position: absolute;
  top: 4%;
  right: 8%;
  width: 60px;
  height: 60px;
  background: radial-gradient(circle, #FFE066 40%, #FFD700 70%, rgba(255,215,0,0) 100%);
  border-radius: 50%;
  box-shadow: 0 0 30px 10px rgba(255,220,0,0.5);
  animation: sunPulse 4s ease-in-out infinite;
}

@keyframes sunPulse {
  0%,100%{box-shadow:0 0 30px 10px rgba(255,220,0,0.5);}
  50%{box-shadow:0 0 50px 20px rgba(255,220,0,0.7);}
}

/* Sunflower plants */
.sf-plant {
  position: absolute;
  bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.sf-stem {
  width: 5px;
  background: linear-gradient(180deg, #4a7c1f, #2d5e12);
  border-radius: 3px;
  position: relative;
}

.sf-leaf-l, .sf-leaf-r {
  position: absolute;
  width: 18px;
  height: 10px;
  background: #3a7a18;
  border-radius: 50% 10% 50% 10%;
}
.sf-leaf-l { left: -16px; transform: rotate(-30deg); }
.sf-leaf-r { right: -16px; transform: rotate(30deg) scaleX(-1); }

.sf-head {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sf-center {
  border-radius: 50%;
  background: radial-gradient(circle, #5a3010 40%, #3d1f08 100%);
  border: 2px solid #2a1005;
  z-index: 2;
  position: relative;
}

.sf-petals {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.sf-petal {
  position: absolute;
  background: linear-gradient(180deg, #FFE044, #FFA800);
  border-radius: 50% 50% 30% 30%;
  transform-origin: bottom center;
}

@keyframes sway {
  0%,100%{transform: rotate(var(--base-rot, -3deg));}
  50%{transform: rotate(var(--sway-rot, 3deg));}
}

@keyframes cloudDrift {
  from{transform:translateX(-200px);}
  to{transform:translateX(calc(100vw + 200px));}
}

/* Butterfly */
.butterfly {
  position: absolute;
  font-size: 18px;
  animation: flutter linear infinite;
  pointer-events: none;
}

@keyframes flutter {
  0%{transform:translate(0,0) rotate(0deg);}
  25%{transform:translate(30px,-20px) rotate(10deg);}
  50%{transform:translate(60px,0px) rotate(-5deg);}
  75%{transform:translate(30px,15px) rotate(8deg);}
  100%{transform:translate(0,0) rotate(0deg);}
}

/* ===== SCANLINES ===== */
.scanlines {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
  pointer-events: none;
  z-index: 999;
}

/* ===== ARCADE MACHINE ===== */
.arcade-machine {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
  position: relative;
  z-index: 10;
}

.arcade-header {
  text-align: center;
  padding: 20px 10px;
  border: 4px solid var(--sun);
  border-radius: 4px;
  margin-bottom: 16px;
  background: linear-gradient(180deg, rgba(26,10,46,0.82) 0%, rgba(13,13,26,0.82) 100%);
  box-shadow: var(--glow-gold), inset 0 0 30px rgba(255,215,0,0.05);
  position: relative;
  overflow: hidden;
}

.arcade-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: repeating-linear-gradient(90deg, #FFD700 0px, #FFD700 10px, transparent 10px, transparent 20px);
  animation: marquee-border 1s linear infinite;
}

@keyframes marquee-border {
  from { transform: translateX(0); }
  to { transform: translateX(20px); }
}

.title-main {
  font-size: 24px;
  color: var(--sun);
  text-shadow: var(--glow-gold);
  letter-spacing: 3px;
  margin-bottom: 6px;
  animation: flicker 3s infinite;
}

.title-sub {
  font-size: 10px;
  color: var(--leaf-light);
  text-shadow: var(--glow-green);
  letter-spacing: 2px;
}

@keyframes flicker {
  0%, 95%, 100% { opacity: 1; }
  96% { opacity: 0.8; }
  97% { opacity: 1; }
  98% { opacity: 0.6; }
}

.sunflower-row {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 10px 0;
  font-size: 22px;
}

.sf { animation: sway2 2s ease-in-out infinite; display: inline-block; }
.sf:nth-child(2) { animation-delay: 0.3s; }
.sf:nth-child(3) { animation-delay: 0.6s; }
.sf:nth-child(4) { animation-delay: 0.9s; }
.sf:nth-child(5) { animation-delay: 1.2s; }

@keyframes sway2 {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}

.screen {
  background: rgba(0,17,0,0.75);
  border: 4px solid var(--sun);
  border-radius: 4px;
  padding: 24px;
  min-height: 520px;
  box-shadow: var(--glow-gold), inset 0 0 40px rgba(0,17,0,0.5);
  position: relative;
  backdrop-filter: blur(2px);
}

.round-indicator {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.round-pip {
  width: 14px; height: 14px;
  border: 2px solid var(--sun-dark);
  background: transparent;
  transition: all 0.3s;
}

.round-pip.active { background: var(--sun); box-shadow: var(--glow-gold); }
.round-pip.done { background: var(--leaf); box-shadow: var(--glow-green); }

.score-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: rgba(255,215,0,0.08);
  border: 2px solid rgba(255,215,0,0.3);
  margin-bottom: 16px;
  font-size: 9px;
  flex-wrap: wrap;
  gap: 6px;
}

.score-val { color: var(--sun); text-shadow: var(--glow-gold); }
.combo-val { color: var(--pixel-green); }
.round-label { color: #aaa; }

.section-title {
  text-align: center;
  font-size: 13px;
  color: var(--sun);
  text-shadow: var(--glow-gold);
  margin-bottom: 6px;
  letter-spacing: 2px;
}

.section-sub {
  text-align: center;
  font-size: 8px;
  color: #888;
  margin-bottom: 20px;
}

.question-text {
  color: var(--pixel-white);
  line-height: 1.8;
  margin-bottom: 20px;
  padding: 14px;
  background: rgba(255,255,255,0.03);
  border-left: 3px solid var(--sun);
  font-family: 'VT323', monospace;
  font-size: 20px;
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

@media (max-width: 500px) {
  .options-grid { grid-template-columns: 1fr; }
  .title-main { font-size: 16px; }
  .memory-grid { grid-template-columns: repeat(3, 1fr) !important; }
}

.option-btn {
  padding: 12px 10px;
  background: rgba(0,255,65,0.05);
  border: 2px solid rgba(0,255,65,0.3);
  color: var(--pixel-green);
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  line-height: 1.6;
}

.option-btn:hover:not(:disabled) {
  background: rgba(255,215,0,0.1);
  border-color: var(--sun);
  color: var(--sun);
  box-shadow: var(--glow-gold);
}

.option-btn.correct {
  background: rgba(0,255,65,0.2);
  border-color: var(--leaf-light);
  color: var(--leaf-light);
  box-shadow: var(--glow-green);
}

.option-btn.wrong {
  background: rgba(255,68,68,0.15);
  border-color: var(--pixel-red);
  color: var(--pixel-red);
  box-shadow: var(--glow-red);
}

.option-btn:disabled { cursor: not-allowed; opacity: 0.7; }

/* ===== WRONG ANSWER OVERLAY ===== */
#wrong-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 9998;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
}

#wrong-overlay.show { display: flex; }

.wrong-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 20px;
  color: var(--pixel-red);
  text-shadow: var(--glow-red);
  animation: wrongShake 0.4s ease-in-out 3;
  margin-bottom: 16px;
}

.wrong-urdu {
  font-family: 'VT323', monospace;
  font-size: 38px;
  color: #ff6666;
  margin-bottom: 16px;
  line-height: 1.3;
  animation: wrongPulse 0.6s ease-in-out infinite alternate;
}

.correct-reveal {
  font-family: 'VT323', monospace;
  font-size: 22px;
  color: var(--leaf-light);
  border: 2px solid var(--leaf-light);
  padding: 10px 20px;
  background: rgba(0,255,65,0.08);
  box-shadow: var(--glow-green);
  max-width: 500px;
  margin: 0 auto;
  line-height: 1.5;
}

@keyframes wrongShake {
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-8px);}
  75%{transform:translateX(8px);}
}

@keyframes wrongPulse {
  from{text-shadow:0 0 10px #ff4444;}
  to{text-shadow:0 0 30px #ff0000, 0 0 60px #ff0000;}
}

/* ===== FEEDBACK POPUP (correct) ===== */
.feedback-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: #0d0d1a;
  border: 4px solid var(--sun);
  padding: 28px 36px;
  text-align: center;
  z-index: 9999;
  box-shadow: var(--glow-gold);
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  max-width: 90%;
  min-width: 260px;
}

.feedback-popup.show { transform: translate(-50%, -50%) scale(1); }
.feedback-popup.correct-fb { border-color: var(--leaf-light); box-shadow: var(--glow-green); }

.feedback-emoji { font-size: 44px; margin-bottom: 12px; display: block; }
.feedback-urdu { font-family: 'VT323', monospace; font-size: 30px; margin-bottom: 8px; }
.feedback-pts { font-size: 10px; color: var(--sun); }

.action-btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: rgba(255,215,0,0.1);
  border: 3px solid var(--sun);
  color: var(--sun);
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  cursor: pointer;
  text-align: center;
  margin-top: 12px;
  transition: all 0.15s;
  text-shadow: var(--glow-gold);
  box-shadow: var(--glow-gold);
  letter-spacing: 2px;
}

.action-btn:hover { background: rgba(255,215,0,0.2); transform: scale(1.02); }

.progress-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 8px;
  color: #666;
  margin-bottom: 12px;
}

.progress-bar-wrap {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.1);
  margin: 0 10px;
  border: 1px solid rgba(255,215,0,0.2);
}

.progress-bar-fill {
  height: 100%;
  background: var(--sun);
  transition: width 0.4s;
  box-shadow: var(--glow-gold);
}

.upload-zone {
  border: 3px dashed rgba(255,215,0,0.5);
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: rgba(255,215,0,0.02);
  margin-bottom: 16px;
}

.loading-bar { height: 8px; background: rgba(255,255,255,0.1); border: 1px solid var(--sun); margin: 16px 0; overflow: hidden; }
.loading-fill { height: 100%; background: linear-gradient(90deg, var(--sun-dark), var(--sun), var(--leaf)); animation: loading-anim 2s ease-in-out infinite; width: 70%; }
@keyframes loading-anim { 0%{transform:translateX(-100%);} 100%{transform:translateX(200%);} }

.memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }

.mem-card {
  aspect-ratio: 1;
  border: 2px solid rgba(255,215,0,0.3);
  background: rgba(255,215,0,0.05);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'VT323', monospace;
  font-size: 13px;
  text-align: center;
  padding: 6px;
  transition: all 0.2s;
  color: transparent;
  line-height: 1.3;
  min-height: 70px;
}

.mem-card.flipped { background: rgba(0,255,65,0.1); border-color: var(--leaf-light); color: var(--leaf-light); }
.mem-card.matched { background: rgba(255,215,0,0.15); border-color: var(--sun); color: var(--sun); cursor: default; }
.mem-card.shake { animation: shake 0.4s; border-color: var(--pixel-red); color: var(--pixel-red); }
.mem-card:hover:not(.matched) { border-color: var(--sun); box-shadow: var(--glow-gold); }

@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

.concept-map-area { position: relative; height: 340px; border: 2px solid rgba(255,215,0,0.2); background: rgba(0,0,0,0.3); margin-bottom: 12px; overflow: hidden; }

.concept-node {
  position: absolute;
  padding: 8px 12px;
  background: rgba(255,215,0,0.1);
  border: 2px solid rgba(255,215,0,0.4);
  color: var(--sun);
  font-family: 'VT323', monospace;
  font-size: 15px;
  cursor: grab;
  user-select: none;
  white-space: nowrap;
  z-index: 10;
  transition: border-color 0.2s;
}

.concept-node:hover { border-color: var(--sun); box-shadow: var(--glow-gold); }
.concept-node.selected { border-color: #ff44ff; box-shadow: 0 0 10px #ff44ff; background: rgba(255,68,255,0.15); }

.connect-btn-wrap { display: flex; gap: 8px; margin-bottom: 10px; }

.small-btn {
  flex: 1;
  padding: 10px;
  border: 2px solid rgba(255,215,0,0.4);
  background: rgba(255,215,0,0.05);
  color: var(--sun);
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  cursor: pointer;
  transition: all 0.15s;
}
.small-btn:hover { background: rgba(255,215,0,0.12); border-color: var(--sun); }
.small-btn.active { background: rgba(255,215,0,0.2); border-color: var(--sun); box-shadow: var(--glow-gold); }

.wheel-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
.wheel-svg { filter: drop-shadow(0 0 10px rgba(255,215,0,0.4)); }

.teach-textarea {
  width: 100%;
  height: 130px;
  background: rgba(0,255,65,0.03);
  border: 2px solid rgba(0,255,65,0.3);
  color: var(--pixel-green);
  font-family: 'VT323', monospace;
  font-size: 18px;
  padding: 12px;
  resize: none;
  line-height: 1.5;
  margin-bottom: 10px;
}
.teach-textarea:focus { outline: none; border-color: var(--sun); box-shadow: var(--glow-gold); }

.ai-response-box {
  background: rgba(0,255,65,0.04);
  border: 2px solid rgba(0,255,65,0.2);
  padding: 14px;
  margin-bottom: 12px;
  font-family: 'VT323', monospace;
  font-size: 17px;
  color: var(--pixel-green);
  line-height: 1.6;
  min-height: 80px;
}

.scoreboard { text-align: center; }

.score-big {
  font-size: 44px;
  color: var(--sun);
  text-shadow: var(--glow-gold);
  margin: 16px 0;
  animation: pulse-score 1.5s ease-in-out infinite;
}

@keyframes pulse-score { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

.grade-badge { display: inline-block; padding: 10px 24px; border: 3px solid var(--sun); font-size: 20px; color: var(--sun); text-shadow: var(--glow-gold); box-shadow: var(--glow-gold); margin-bottom: 16px; }

.round-breakdown { text-align: left; margin: 16px 0; }
.round-row { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid rgba(255,215,0,0.15); font-size: 8px; color: #aaa; }
.round-row-score { color: var(--sun); }

.remarks-box {
  padding: 14px;
  background: rgba(0,255,65,0.04);
  border-left: 3px solid var(--leaf-light);
  margin: 16px 0;
  font-family: 'VT323', monospace;
  font-size: 18px;
  color: var(--pixel-green);
  line-height: 1.7;
  text-align: left;
}

.sunflower-field-emoji { display: flex; justify-content: center; gap: 6px; margin: 12px 0; font-size: 24px; }

.coin-insert { text-align: center; font-size: 9px; color: var(--sun-dark); animation: blink 1s step-end infinite; margin-top: 10px; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

.intro-screen { text-align: center; padding: 20px 10px; }
.intro-logo { font-size: 15px; color: var(--sun); text-shadow: var(--glow-gold); margin-bottom: 20px; line-height: 2.2; }
.intro-rounds { text-align: left; max-width: 420px; margin: 0 auto 20px; }

.intro-round-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,215,0,0.15); font-size: 8px; color: #aaa; }
.round-num { width: 26px; height: 26px; background: rgba(255,215,0,0.15); border: 2px solid var(--sun); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--sun); flex-shrink: 0; }

.status-msg { font-family: 'VT323', monospace; font-size: 18px; color: #888; text-align: center; margin: 8px 0; }

.spin-btn { display: block; margin: 0 auto 16px; padding: 14px 28px; background: rgba(255,215,0,0.1); border: 3px solid var(--sun); color: var(--sun); font-family: 'Press Start 2P', monospace; font-size: 9px; cursor: pointer; text-shadow: var(--glow-gold); box-shadow: var(--glow-gold); transition: all 0.15s; }
.spin-btn:hover:not(:disabled) { background: rgba(255,215,0,0.2); }
.spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.connection-list { max-height: 70px; overflow-y: auto; margin-bottom: 10px; font-family: 'VT323', monospace; font-size: 15px; color: var(--leaf-light); }
.connection-item { padding: 3px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }

.pixel-divider { height: 2px; background: repeating-linear-gradient(90deg, var(--sun) 0px, var(--sun) 8px, transparent 8px, transparent 16px); margin: 14px 0; opacity: 0.4; }

.teach-grade { font-size: 9px; padding: 8px 12px; margin: 8px 0; border: 2px solid; }
.grade-a { border-color: var(--leaf-light); color: var(--leaf-light); background: rgba(0,255,65,0.08); }
.grade-b { border-color: var(--sun); color: var(--sun); background: rgba(255,215,0,0.08); }
.grade-c { border-color: var(--pixel-red); color: var(--pixel-red); background: rgba(255,68,68,0.08); }

/* ===== CHAPTER SELECT ===== */
.chapter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 20px 0;
}

.chapter-card {
  border: 3px solid rgba(255,215,0,0.4);
  padding: 18px 14px;
  background: rgba(255,215,0,0.04);
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
}

.chapter-card:hover {
  border-color: var(--sun);
  background: rgba(255,215,0,0.12);
  box-shadow: var(--glow-gold);
  transform: scale(1.02);
}

.chapter-num { font-size: 9px; color: var(--sun-dark); margin-bottom: 6px; }
.chapter-title { font-size: 8px; color: var(--sun); line-height: 1.7; margin-bottom: 6px; }
.chapter-desc { font-family: 'VT323', monospace; font-size: 16px; color: #888; line-height: 1.4; }

@media(max-width:500px){ .chapter-grid{grid-template-columns:1fr;} }

.round-intro-screen { text-align: center; padding: 20px 10px; }

<!-- Sunflower Field Background -->
<div id="sunflower-field"></div>
<div class="scanlines"></div>

<div class="arcade-machine">

<script>
// =============================================
// SUNFLOWER FIELD BACKGROUND
// =============================================
(function buildField() {
  const field = document.getElementById('sunflower-field');

  // Sky sun
  const skySun = document.createElement('div');
  skySun.className = 'sky-sun';
  field.appendChild(skySun);

  // Clouds
  const clouds = [
    {w:120,h:30,top:'8%',dur:'25s',delay:'0s'},
    {w:80,h:22,top:'14%',dur:'35s',delay:'-10s'},
    {w:160,h:38,top:'5%',dur:'45s',delay:'-20s'},
    {w:90,h:25,top:'18%',dur:'30s',delay:'-5s'},
  ];
  clouds.forEach(c => {
    const cl = document.createElement('div');
    cl.className = 'cloud';
    cl.style.cssText = `width:${c.w}px;height:${c.h}px;top:${c.top};left:-${c.w}px;animation-duration:${c.dur};animation-delay:${c.delay}`;
    cl.style.transform = `scaleY(0.6)`;
    field.appendChild(cl);
  });

  // Butterflies
  const butterflies = ['🦋','🦋','🐝','🦋'];
  butterflies.forEach((b,i) => {
    const el = document.createElement('div');
    el.className = 'butterfly';
    el.textContent = b;
    el.style.cssText = `left:${15+i*20}%;top:${20+i*5}%;animation-duration:${6+i*2}s;animation-delay:${-i*1.5}s`;
    field.appendChild(el);
  });

  // Sunflowers
  const sfData = [
    {left:'3%', h:120, size:38, delay:0},
    {left:'9%', h:95, size:30, delay:0.4},
    {left:'15%',h:140, size:44, delay:0.8},
    {left:'20%',h:80, size:26, delay:0.2},
    {left:'25%',h:110, size:36, delay:1.1},
    {left:'30%',h:130, size:40, delay:0.6},
    {left:'36%',h:90, size:28, delay:0.9},
    {left:'42%',h:150, size:46, delay:0.3},
    {left:'48%',h:100, size:32, delay:1.3},
    {left:'54%',h:125, size:39, delay:0.5},
    {left:'60%',h:85, size:28, delay:1.0},
    {left:'66%',h:145, size:45, delay:0.7},
    {left:'72%',h:95, size:30, delay:0.2},
    {left:'78%',h:120, size:38, delay:1.2},
    {left:'84%',h:105, size:34, delay:0.4},
    {left:'90%',h:135, size:42, delay:0.8},
    {left:'96%',h:88, size:27, delay:1.4},
  ];

  sfData.forEach(s => {
    const plant = document.createElement('div');
    plant.className = 'sf-plant';
    plant.style.cssText = `left:${s.left};animation:sway ${2+Math.random()}s ease-in-out infinite;animation-delay:${s.delay}s;--base-rot:-${3+Math.random()*4}deg;--sway-rot:${3+Math.random()*4}deg`;

    // Head
    const head = document.createElement('div');
    head.className = 'sf-head';
    head.style.cssText = `width:${s.size}px;height:${s.size}px;`;

    // Petals
    const petalCount = 12;
    for (let p = 0; p < petalCount; p++) {
      const petal = document.createElement('div');
      petal.className = 'sf-petal';
      const pw = s.size * 0.28, ph = s.size * 0.42;
      const angle = (360/petalCount)*p;
      const dist = s.size * 0.32;
      const rad = angle * Math.PI / 180;
      const cx = Math.cos(rad-Math.PI/2)*dist + s.size/2 - pw/2;
      const cy = Math.sin(rad-Math.PI/2)*dist + s.size/2 - ph;
      petal.style.cssText = `width:${pw}px;height:${ph}px;left:${cx}px;top:${cy}px;transform:rotate(${angle}deg);transform-origin:${pw/2}px ${ph}px`;
      head.appendChild(petal);
    }

    // Center
    const center = document.createElement('div');
    center.className = 'sf-center';
    const cs = s.size * 0.42;
    center.style.cssText = `width:${cs}px;height:${cs}px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)`;
    head.appendChild(center);

    // Stem
    const stem = document.createElement('div');
    stem.className = 'sf-stem';
    stem.style.cssText = `height:${s.h}px;width:${Math.max(4,s.size*0.1)}px`;

    // Leaf
    const leafMid = Math.floor(s.h * 0.5);
    const ll = document.createElement('div');
    ll.className = 'sf-leaf-l';
    ll.style.top = `${leafMid}px`;
    stem.appendChild(ll);
    const lr = document.createElement('div');
    lr.className = 'sf-leaf-r';
    lr.style.top = `${leafMid + 20}px`;
    stem.appendChild(lr);

    plant.appendChild(head);
    plant.appendChild(stem);
    field.appendChild(plant);
  });
})();

// =============================================

const ROUND_NAMES = ['QUIZ BATTLE','MEMORY MATCH','CONCEPT MAP','TRIVIA WHEEL','TEACH THE AI'];
const ROUND_ICONS = ['❓','🃏','🗺️','🎯','🤖'];

const state = {
  phase: 'intro',
  chapter: null,
  score: 0,
  roundScores: [0,0,0,0,0],
  combo: 0,
  maxCombo: 0,
  lives: 3,
  currentRound: 0,
  currentQ: 0,
  memCards: [],
  memFlipped: [],
  memMatched: [],
  conceptNodes: [],
  conceptConnections: [],
  connectMode: false,
  connectFrom: null,
  wheelAngle: 0,
  wheelSpinning: false,
  currentWheelTopic: '',
  teachQ: 0,
  teachAnswers: ['',''],
  teachGrades: [null, null],
  loading: false,
};

// =============================================
// WRONG ANSWER OVERLAY
// =============================================
const BAAP_MSGS = [
  "BAAP KO SIKANA PADEGA 😤",
  "YEH KYA THA BHAI?! 😭",
  "DIL PE PATTHAR RAKH KE PADHO 📚",
  "YAAR SERIOUSLY?! 🤦",
  "ABBU SE REVISION KARWAO 😩",
  "GALAT! BILKUL GALAT! ❌",
];

let wrongTimer = null;
function showWrong(correctText) {
  const ov = document.getElementById('wrong-overlay');
  document.getElementById('wrong-urdu-text').textContent = BAAP_MSGS[Math.floor(Math.random()*BAAP_MSGS.length)];
  document.getElementById('correct-reveal-text').textContent = '✓ ' + correctText;
  ov.classList.add('show');
  if (wrongTimer) clearTimeout(wrongTimer);
  wrongTimer = setTimeout(() => { ov.classList.remove('show'); }, 3200);
}

function showCorrect(pts) {
  const popup = document.getElementById('feedback-popup');
  popup.classList.remove('show');
  document.getElementById('fb-pts').textContent = `+${pts} POINTS!`;
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), 1400);
}

// =============================================
// RENDER
// =============================================
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (state.phase === 'intro') app.innerHTML = renderIntro();
  else if (state.phase === 'chapter-select') app.innerHTML = renderChapterSelect();
  else if (state.phase === 'round-intro') app.innerHTML = renderRoundIntro();
  else if (state.phase === 'r1') app.innerHTML = renderQuiz();
  else if (state.phase === 'r2') app.innerHTML = renderMemory();
  else if (state.phase === 'r3') app.innerHTML = renderConceptMap();
  else if (state.phase === 'r4') app.innerHTML = renderTriviaWheel();
  else if (state.phase === 'r5') app.innerHTML = renderTeachAI();
  else if (state.phase === 'scoreboard') app.innerHTML = renderScoreboard();
  attachEvents();
}

function renderRoundPips() {
  return `<div class="round-indicator">${ROUND_NAMES.map((n,i)=>`<div class="round-pip ${i<state.currentRound?'done':i===state.currentRound?'active':''}"></div>`).join('')}</div>`;
}

function renderScoreBar() {
  const hearts = '🌻'.repeat(state.lives) + '🍂'.repeat(Math.max(0,3-state.lives));
  return `<div class="score-bar"><span class="score-val">★ ${state.score}</span><span class="combo-val">COMBO x${state.combo}</span><span>${hearts}</span><span class="round-label">RD ${state.currentRound+1}/5</span></div>`;
}

function renderIntro() {
  return `<div class="intro-screen">
    <div class="sunflower-field-emoji">🌻🌻🌻🌻🌻🌻🌻</div>
    <div class="intro-logo">STUDY ARCADE<br>SYS380 EDITION</div>
    <div class="intro-rounds">
      ${[['QUIZ BATTLE','7 hard questions — pick the right answer'],['MEMORY MATCH','7 pairs — flip and match'],['CONCEPT MAP','drag & connect ideas'],['TRIVIA WHEEL','spin for topic — quick fire'],['TEACH THE AI','explain it back — get graded']].map((r,i)=>`
      <div class="intro-round-item">
        <div class="round-num">${i+1}</div>
        <div><div style="color:var(--sun);margin-bottom:3px;font-size:9px">${r[0]}</div>${r[1]}</div>
      </div>`).join('')}
    </div>
    <button class="action-btn" onclick="state.phase='chapter-select';render()">▶ INSERT COIN</button>
    <div class="coin-insert">PRESS START</div>
  </div>`;
}

function renderChapterSelect() {
  const chs = [5,6,7,8];
  return `<div style="text-align:center;padding:10px 0">
    <div class="section-title">📚 SELECT CHAPTER</div>
    <div class="section-sub">choose your battle — each chapter is a full 5-round game</div>
    <div class="chapter-grid">
      ${chs.map(n => {
        const ch = CHAPTERS[n];
        return `<div class="chapter-card" onclick="selectChapter(${n})">
          <div class="chapter-num">CHAPTER ${n}</div>
          <div class="chapter-title">${ch.icon} ${ch.name}</div>
          <div class="chapter-desc">${ch.desc}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function selectChapter(n) {
  state.chapter = n;
  state.score = 0;
  state.roundScores = [0,0,0,0,0];
  state.combo = 0;
  state.maxCombo = 0;
  state.lives = 3;
  state.currentRound = 0;
  state.currentQ = 0;
  state.teachQ = 0;
  state.teachAnswers = ['',''];
  state.teachGrades = [null,null];
  // Build memory cards
  buildMemoryCards(CHAPTERS[n].memPairs);
  // Build concept nodes
  buildConceptNodes(CHAPTERS[n].concepts, CHAPTERS[n].connections);
  state.phase = 'round-intro';
  render();
}

function renderRoundIntro() {
  const r = state.currentRound;
  const descs = [
    '7 hard questions from your chapter. no hints. just you vs the material.',
    '7 term/definition pairs. flip and match them all!',
    'drag nodes. draw connections. show you understand the big picture.',
    'spin the wheel. land on a topic. answer fast!',
    'explain the concept back in your own words. get graded by the machine.'
  ];
  return `<div class="round-intro-screen">
    ${renderRoundPips()}
    <div class="round-intro-icon">${ROUND_ICONS[r]}</div>
    <div class="section-title">ROUND ${r+1}: ${ROUND_NAMES[r]}</div>
    <div style="font-family:'VT323',monospace;font-size:18px;color:#888;margin:10px 0 20px;line-height:1.6">${descs[r]}</div>
    <div style="font-size:8px;color:rgba(255,215,0,0.5);margin-bottom:16px">Chapter ${state.chapter}: ${CHAPTERS[state.chapter].name}</div>
    <button class="action-btn" onclick="startRound()">▶ BEGIN ROUND ${r+1}</button>
  </div>`;
}

function startRound() {
  const phases = ['r1','r2','r3','r4','r5'];
  state.phase = phases[state.currentRound];
  state.currentQ = 0;
  state.connectMode = false;
  state.connectFrom = null;
  state.currentWheelTopic = '';
  state.wheelSpinning = false;
  render();
}

// =============================================
// ROUND 1 — QUIZ
// =============================================
function renderQuiz() {
  const qs = CHAPTERS[state.chapter].quiz;
  const q = qs[state.currentQ];
  if (!q) { advanceRound(); return ''; }
  return `<div>
    ${renderRoundPips()}${renderScoreBar()}
    <div class="progress-row">
      <span>Q ${state.currentQ+1}/7</span>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${((state.currentQ)/7)*100}%"></div></div>
      <span>${7-state.currentQ} left</span>
    </div>
    <div class="question-text">${q.q}</div>
    <div class="options-grid">
      ${q.opts.map((o,i)=>`<button class="option-btn" id="opt-${i}" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
    </div>
  </div>`;
}

function answerQuiz(idx) {
  const q = CHAPTERS[state.chapter].quiz[state.currentQ];
  if (!q) return;
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  const correct = idx === q.c;
  document.getElementById(`opt-${idx}`).classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    document.getElementById(`opt-${q.c}`).classList.add('correct');
    state.combo = 0;
    state.lives = Math.max(0, state.lives - 1);
    showWrong(q.opts[q.c]);
    setTimeout(() => { state.currentQ++; if (state.currentQ >= 7) advanceRound(); else render(); }, 3400);
  } else {
    state.combo++;
    state.maxCombo = Math.max(state.maxCombo, state.combo);
    const pts = 10 + (state.combo > 2 ? 5 : 0);
    state.score += pts;
    state.roundScores[0] += pts;
    showCorrect(pts);
    setTimeout(() => { state.currentQ++; if (state.currentQ >= 7) advanceRound(); else render(); }, 1600);
  }
}

// =============================================
// ROUND 2 — MEMORY MATCH
// =============================================
function buildMemoryCards(pairs) {
  const cards = [];
  pairs.forEach((p,i) => {
    cards.push({text:p.term, pairId:i, type:'term'});
    cards.push({text:p.def, pairId:i, type:'def'});
  });
  for (let i=cards.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; }
  state.memCards = cards;
  state.memFlipped = [];
  state.memMatched = [];
}

function renderMemory() {
  const matched = state.memMatched.length / 2;
  return `<div>
    ${renderRoundPips()}${renderScoreBar()}
    <div class="section-title">🃏 MEMORY MATCH</div>
    <div class="section-sub">match all 7 term/definition pairs — ${matched}/7 matched</div>
    <div class="memory-grid">
      ${state.memCards.map((c,i) => {
        const flipped = state.memFlipped.includes(i);
        const matched = state.memMatched.includes(i);
        return `<div class="mem-card ${flipped?'flipped':''} ${matched?'matched':''}" id="mc-${i}" onclick="flipCard(${i})">${(flipped||matched)?c.text:''}</div>`;
      }).join('')}
    </div>
  </div>`;
}

let memLock = false;
function flipCard(i) {
  if (memLock||state.memMatched.includes(i)||state.memFlipped.includes(i)||state.memFlipped.length>=2) return;
  state.memFlipped.push(i);
  render();
  if (state.memFlipped.length === 2) {
    memLock = true;
    const [a,b] = state.memFlipped;
    const ca = state.memCards[a], cb = state.memCards[b];
    setTimeout(() => {
      if (ca.pairId===cb.pairId && ca.type!==cb.type) {
        state.memMatched.push(a,b);
        state.score += 10;
        state.roundScores[1] += 10;
        state.combo++;
        state.maxCombo = Math.max(state.maxCombo, state.combo);
        showCorrect(10);
      } else {
        state.combo = 0;
        const c1=document.getElementById(`mc-${a}`), c2=document.getElementById(`mc-${b}`);
        if(c1){c1.classList.add('shake');setTimeout(()=>c1.classList.remove('shake'),400);}
        if(c2){c2.classList.add('shake');setTimeout(()=>c2.classList.remove('shake'),400);}
      }
      state.memFlipped = [];
      memLock = false;
      if (state.memMatched.length >= 14) setTimeout(()=>advanceRound(), 600);
      else render();
    }, 900);
  }
}

// =============================================
// ROUND 3 — CONCEPT MAP
// =============================================
function buildConceptNodes(concepts, connections) {
  const pos = [{x:20,y:20},{x:180,y:20},{x:340,y:20},{x:480,y:20},{x:60,y:140},{x:220,y:140},{x:390,y:140},{x:150,y:260}];
  state.conceptNodes = concepts.slice(0,8).map((c,i)=>({
    label: c.length>14 ? c.substring(0,13)+'…' : c,
    x: pos[i]?.x ?? (i*80)%460,
    y: pos[i]?.y ?? Math.floor(i/5)*120+20
  }));
  state.conceptConnections = connections || [];
}

function renderConceptMap() {
  const nodes = state.conceptNodes;
  const conns = state.conceptConnections;
  return `<div>
    ${renderRoundPips()}${renderScoreBar()}
    <div class="section-title">🗺️ CONCEPT MAP</div>
    <div class="section-sub">drag nodes, use connect mode to draw links, then submit</div>
    <div class="connect-btn-wrap">
      <button class="small-btn ${state.connectMode?'active':''}" onclick="toggleConnectMode()">${state.connectMode?'✓ CONNECTING':'⬡ CONNECT MODE'}</button>
      <button class="small-btn" onclick="clearConnections()">✕ CLEAR LINKS</button>
    </div>
    <div class="concept-map-area" id="cmap">
      <svg id="cmap-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none">
        ${conns.map(c=>{const n1=nodes[c[0]],n2=nodes[c[1]];return`<line x1="${n1.x+55}" y1="${n1.y+16}" x2="${n2.x+55}" y2="${n2.y+16}" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>`;}).join('')}
      </svg>
      ${nodes.map((n,i)=>`<div class="concept-node ${state.connectFrom===i?'selected':''}" id="cn-${i}" style="left:${n.x}px;top:${n.y}px" onmousedown="startDrag(event,${i})" onclick="handleNodeClick(${i})">${n.label}</div>`).join('')}
    </div>
    ${conns.length>0?`<div class="connection-list">${conns.map(c=>`<div class="connection-item">↔ ${nodes[c[0]].label} — ${nodes[c[1]].label}</div>`).join('')}</div>`:''}
    <div id="cmap-feedback"></div>
    <button class="action-btn" onclick="checkConceptMap()">✓ SUBMIT CONCEPT MAP</button>
  </div>`;
}

function toggleConnectMode() { state.connectMode=!state.connectMode; state.connectFrom=null; render(); }
function clearConnections() { state.conceptConnections=[]; render(); }

function handleNodeClick(i) {
  if (!state.connectMode) return;
  if (state.connectFrom===null) { state.connectFrom=i; render(); return; }
  if (state.connectFrom!==i) {
    const exists=state.conceptConnections.some(c=>(c[0]===state.connectFrom&&c[1]===i)||(c[0]===i&&c[1]===state.connectFrom));
    if (!exists) state.conceptConnections.push([state.connectFrom,i]);
  }
  state.connectFrom=null; render();
}

let dragIdx=null,dragOX=0,dragOY=0;
function startDrag(e,i) {
  if (state.connectMode) return;
  dragIdx=i;
  const area=document.getElementById('cmap');
  if (!area) return;
  const rect=area.getBoundingClientRect();
  dragOX=e.clientX-rect.left-state.conceptNodes[i].x;
  dragOY=e.clientY-rect.top-state.conceptNodes[i].y;
  document.onmousemove=ev=>{
    if (dragIdx===null) return;
    const ar=document.getElementById('cmap');
    if (!ar) return;
    const r=ar.getBoundingClientRect();
    state.conceptNodes[dragIdx].x=Math.max(0,Math.min(r.width-120,ev.clientX-r.left-dragOX));
    state.conceptNodes[dragIdx].y=Math.max(0,Math.min(r.height-40,ev.clientY-r.top-dragOY));
    const el=document.getElementById(`cn-${dragIdx}`);
    if(el){el.style.left=state.conceptNodes[dragIdx].x+'px';el.style.top=state.conceptNodes[dragIdx].y+'px';}
    const svg=document.getElementById('cmap-svg');
    if(svg) svg.innerHTML=state.conceptConnections.map(c=>{
      const n1=state.conceptNodes[c[0]],n2=state.conceptNodes[c[1]];
      return `<line x1="${n1.x+55}" y1="${n1.y+16}" x2="${n2.x+55}" y2="${n2.y+16}" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>`;
    }).join('');
  };
  document.onmouseup=()=>{dragIdx=null;document.onmousemove=null;document.onmouseup=null;};
  e.preventDefault();
}

function checkConceptMap() {
  if (state.conceptConnections.length < 2) {
    const fb=document.getElementById('cmap-feedback');
    if(fb) fb.innerHTML=`<div class="status-msg" style="color:var(--pixel-red)">connect at least 2 pairs first!</div>`;
    return;
  }
  const pts = Math.min(30, state.conceptConnections.length * 6);
  state.score += pts;
  state.roundScores[2] += pts;
  const fb = document.getElementById('cmap-feedback');
  if(fb) fb.innerHTML=`<div class="ai-response-box">Concept map recorded! ${state.conceptConnections.length} connections made. +${pts}/30 pts</div>`;
  showCorrect(pts);
  setTimeout(()=>advanceRound(), 2000);
}

// =============================================
// ROUND 4 — TRIVIA WHEEL
// =============================================
function renderTriviaWheel() {
  const topics = CHAPTERS[state.chapter].wheel;
  const n = topics.length;
  const colors = ['#FFD700','#FFA500','#32CD32','#00BFFF','#FF6B6B','#C084FC'];
  const cx=140,cy=140,r=120;
  let wheelSVG = `<svg width="280" height="280" class="wheel-svg">`;
  topics.forEach((t,i) => {
    const startA = (2*Math.PI/n)*i - Math.PI/2;
    const endA = (2*Math.PI/n)*(i+1) - Math.PI/2;
    const x1=cx+r*Math.cos(startA),y1=cy+r*Math.sin(startA);
    const x2=cx+r*Math.cos(endA),y2=cy+r*Math.sin(endA);
    const midA=(startA+endA)/2;
    const tx=cx+(r*0.65)*Math.cos(midA),ty=cy+(r*0.65)*Math.sin(midA);
    const short=t.length>12?t.substring(0,11)+'…':t;
    wheelSVG+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2} Z" fill="${colors[i%colors.length]}" stroke="#0d0d1a" stroke-width="2"/>`;
    wheelSVG+=`<text x="${tx}" y="${ty}" fill="#0d0d1a" font-family="'Press Start 2P',monospace" font-size="6" text-anchor="middle" dominant-baseline="middle" transform="rotate(${(midA+Math.PI/2)*180/Math.PI},${tx},${ty})">${short}</text>`;
  });
  wheelSVG+=`<circle cx="${cx}" cy="${cy}" r="18" fill="#0d0d1a" stroke="#FFD700" stroke-width="3"/>`;
  wheelSVG+=`<polygon points="${cx},${cy-r-10} ${cx-8},${cy-r+14} ${cx+8},${cy-r+14}" fill="#FFD700"/>`;
  wheelSVG+=`</svg>`;

  if (state.currentWheelTopic) {
    const triviaQ = getTriviaQ();
    return `<div>
      ${renderRoundPips()}${renderScoreBar()}
      <div class="section-title">🎯 TOPIC: ${state.currentWheelTopic}</div>
      <div class="question-text">${triviaQ.q}</div>
      <div class="options-grid">
        ${triviaQ.opts.map((o,i)=>`<button class="option-btn" id="topt-${i}" onclick="answerTrivia(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
      </div>
      <div class="section-sub">${state.currentQ+1}/2 trivia questions</div>
    </div>`;
  }

  return `<div>
    ${renderRoundPips()}${renderScoreBar()}
    <div class="section-title">🎯 TRIVIA WHEEL</div>
    <div class="section-sub">spin to get a random topic, then answer!</div>
    <div class="wheel-wrap"><div id="wheel-container">${wheelSVG}</div></div>
    <button class="spin-btn" id="spin-btn" onclick="spinWheel()" ${state.wheelSpinning?'disabled':''}>
      ${state.wheelSpinning?'SPINNING...':'▶ SPIN THE WHEEL'}
    </button>
  </div>`;
}

function getTriviaQ() {
  const ch = CHAPTERS[state.chapter];
  const topicIdx = ch.wheel.indexOf(state.currentWheelTopic);
  // Generate a trivia question from quiz bank based on topic index
  const qIdx = (topicIdx + state.currentQ * 2) % ch.quiz.length;
  return ch.quiz[qIdx];
}

function spinWheel() {
  if (state.wheelSpinning || state.currentWheelTopic) return;
  state.wheelSpinning = true;
  render();
  const topics = CHAPTERS[state.chapter].wheel;
  const extra = 1440 + Math.floor(Math.random()*360);
  const target = state.wheelAngle + extra;
  const start = performance.now(), dur = 3200, from = state.wheelAngle;
  function frame(now) {
    const t = Math.min(1,(now-start)/dur);
    const ease = 1-Math.pow(1-t,3);
    state.wheelAngle = from + (target-from)*ease;
    const container = document.getElementById('wheel-container');
    if (container) {
      const svgEl = container.querySelector('svg');
      if (svgEl) {
        let g = svgEl.querySelector('g.wheel-rotate');
        if (!g) {
          g = document.createElementNS('http://www.w3.org/2000/svg','g');
          g.classList.add('wheel-rotate');
          while(svgEl.firstChild) g.appendChild(svgEl.firstChild);
          svgEl.appendChild(g);
        }
        g.setAttribute('transform',`rotate(${state.wheelAngle},140,140)`);
      }
    }
    if (t < 1) requestAnimationFrame(frame);
    else {
      state.wheelSpinning = false;
      const n = topics.length;
      const norm = ((360-(state.wheelAngle%360))+360)%360;
      const idx = Math.floor((norm/360)*n)%n;
      state.currentWheelTopic = topics[idx];
      render();
    }
  }
  requestAnimationFrame(frame);
}

function answerTrivia(idx) {
  const q = getTriviaQ();
  if (!q) return;
  document.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
  const correct = idx===q.c;
  document.getElementById(`topt-${idx}`).classList.add(correct?'correct':'wrong');
  if (!correct) {
    document.getElementById(`topt-${q.c}`).classList.add('correct');
    state.combo=0;
    showWrong(q.opts[q.c]);
    setTimeout(()=>{ state.currentQ++; state.currentWheelTopic=''; if(state.currentQ>=2) advanceRound(); else render(); },3400);
  } else {
    state.score+=15; state.roundScores[3]+=15;
    state.combo++; state.maxCombo=Math.max(state.maxCombo,state.combo);
    showCorrect(15);
    setTimeout(()=>{ state.currentQ++; state.currentWheelTopic=''; if(state.currentQ>=2) advanceRound(); else render(); },1600);
  }
}

// =============================================
// ROUND 5 — TEACH THE AI (offline grader)
// =============================================
function renderTeachAI() {
  const ch = CHAPTERS[state.chapter];
  const topic = ch.teach[state.teachQ];
  const grade = state.teachGrades[state.teachQ];

  if (grade) {
    return `<div>
      ${renderRoundPips()}${renderScoreBar()}
      <div class="section-title">🤖 GRADED!</div>
      <div class="teach-grade grade-${grade.letter.toLowerCase()}">${grade.letter} — ${grade.score}/20 pts</div>
      <div class="ai-response-box">${grade.feedback}</div>
      <button class="action-btn" onclick="nextTeach()">▶ ${state.teachQ<1?'NEXT TOPIC':'SEE FINAL SCORE'}</button>
    </div>`;
  }

  return `<div>
    ${renderRoundPips()}${renderScoreBar()}
    <div class="section-title">🤖 TEACH THE AI</div>
    <div class="section-sub">topic ${state.teachQ+1}/2</div>
    <div class="question-text">Explain in your own words:<br>${topic}</div>
    <textarea class="teach-textarea" id="teach-input" placeholder="type your explanation here...">${state.teachAnswers[state.teachQ]}</textarea>
    <button class="action-btn" onclick="submitTeach()">▶ SUBMIT EXPLANATION</button>
  </div>`;
}

function gradeTeach(text, topicIdx) {
  const ch = CHAPTERS[state.chapter];
  const topic = ch.teach[topicIdx];
  const keywords = getKeywords(topicIdx);
  const lower = text.toLowerCase();
  let matched = 0;
  keywords.forEach(k => { if(lower.includes(k.toLowerCase())) matched++; });
  const ratio = matched / keywords.length;
  const wordCount = text.trim().split(/\s+/).length;
  let score = Math.round(ratio * 16) + (wordCount > 40 ? 3 : wordCount > 20 ? 1 : 0);
  score = Math.min(20, Math.max(4, score));
  let letter = score >= 17 ? 'A' : score >= 13 ? 'B' : 'C';
  let feedback = '';
  if (score >= 17) feedback = `Excellent explanation of "${topic}"! You clearly understand the key concepts. ${matched}/${keywords.length} key terms covered — impressive recall.`;
  else if (score >= 13) feedback = `Good effort on "${topic}". You covered the main ideas. Try to also include: ${keywords.filter(k=>!lower.includes(k.toLowerCase())).slice(0,3).join(', ')}.`;
  else feedback = `Your explanation of "${topic}" needs more depth. Key concepts to revisit: ${keywords.filter(k=>!lower.includes(k.toLowerCase())).slice(0,4).join(', ')}. Go back to your notes!`;
  return { letter, score, feedback };
}

function getKeywords(topicIdx) {
  const ch = state.chapter;
  const keywordSets = {
    5: [
      ['legitimate','expert','referent','reward','coercive','French','Raven','power','influence'],
      ['curvilinear','inverted','moderate','conflict','performance','low','high','innovation','tension']
    ],
    6: [
      ['directing','coaching','selling','supporting','delegating','Hersey','Blanchard','maturity','readiness','task','relationship'],
      ['cynicism','spiral','distrust','secretive','authoritarian','trust','transparency','employees','management']
    ],
    7: [
      ['pilot','parallel running','big bang','implementation','risk','scale','consolidation','test'],
      ['Carnall','performance','structure','resonance','accelerator','leadership','culture','ambition','capability','convergent']
    ],
    8: [
      ['action research','diagnosis','vision','commitment','implement','assess','reinforce','collaborative','OD'],
      ['unfreeze','move','refreeze','Lewin','embedding','refreezing','behaviours','culture','reward']
    ]
  };
  return keywordSets[ch][topicIdx] || ['change','management','organization'];
}

function submitTeach() {
  const input = document.getElementById('teach-input');
  if (!input || !input.value.trim() || input.value.trim().split(/\s+/).length < 8) {
    input.style.borderColor='var(--pixel-red)';
    return;
  }
  const text = input.value.trim();
  state.teachAnswers[state.teachQ] = text;
  const grade = gradeTeach(text, state.teachQ);
  state.teachGrades[state.teachQ] = grade;
  state.score += grade.score;
  state.roundScores[4] += grade.score;
  if (grade.score >= 13) showCorrect(grade.score);
  render();
}

function nextTeach() {
  if (state.teachQ < 1) { state.teachQ++; render(); }
  else { state.phase = 'scoreboard'; render(); }
}

// =============================================
// SCOREBOARD
// =============================================
function renderScoreboard() {
  const total = state.score;
  const maxPossible = 7*15 + 7*10 + 30 + 2*15 + 2*20;
  const pct = Math.round((total/maxPossible)*100);
  let grade='F', remark='';
  if(pct>=90){grade='S';remark='ULTRA INSTINCT MODE ACTIVATED 🌻 You are a machine. Baap kaafi proud hain.';}
  else if(pct>=75){grade='A';remark='WAH WAH! 🌻 Strong performance. A few gaps but overall excellent. Keep going!';}
  else if(pct>=60){grade='B';remark='Not bad! 📚 You know the material but some concepts need a revisit. Almost there.';}
  else if(pct>=45){grade='C';remark='Theek hai yaar 😅 You have the basics but a lot of revision needed. Open those slides!';}
  else{grade='D';remark='Baap ko math sikana padega 😤 Back to basics. Read the chapter again slowly.';}

  return `<div class="scoreboard">
    <div class="sunflower-field-emoji">🌻🌱🌻🌱🌻🌱🌻</div>
    <div class="section-title">GAME OVER</div>
    <div class="section-sub">Chapter ${state.chapter}: ${CHAPTERS[state.chapter].name}</div>
    <div class="grade-badge">GRADE: ${grade}</div>
    <div class="score-big">${total}</div>
    <div style="font-size:8px;color:#666;margin-bottom:12px">${pct}% accuracy · max combo: ${state.maxCombo}</div>
    <div class="round-breakdown">
      ${ROUND_NAMES.map((n,i)=>`<div class="round-row"><span>${ROUND_ICONS[i]} ${n}</span><span class="round-row-score">+${state.roundScores[i]}</span></div>`).join('')}
    </div>
    <div class="remarks-box">🌻 ${remark}</div>
    <button class="action-btn" onclick="state.phase='chapter-select';render()">▶ PLAY ANOTHER CHAPTER</button>
    <button class="action-btn" onclick="selectChapter(state.chapter)" style="margin-top:6px;background:rgba(0,255,65,0.05);border-color:rgba(0,255,65,0.4);color:var(--pixel-green);box-shadow:var(--glow-green)">↺ RETRY SAME CHAPTER</button>
  </div>`;
}

function advanceRound() {
  state.currentRound++;
  if (state.currentRound >= 5) { state.phase='scoreboard'; render(); }
  else { state.phase='round-intro'; render(); }
}

function attachEvents() {}

render();
</script>
